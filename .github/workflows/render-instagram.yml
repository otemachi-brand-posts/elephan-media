name: Render Instagram carousels

on:
  push:
    branches: [main]
    paths:
      - 'posts.json'
      - 'scripts/render_posts.py'
      - '.github/workflows/render-instagram.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-elephan-instagram
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install font and renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Render images
        run: python scripts/render_posts.py
      - name: Commit rendered images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Render ELEPHAN Instagram carousels"
          git push
