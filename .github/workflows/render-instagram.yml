name: Render ELEPHAN approved-style Instagram images

on:
  push:
    branches: [main]
    paths:
      - 'posts.json'
      - 'scripts/render_posts.py'
      - 'scripts/render_future_elephan.py'
      - '.github/workflows/render-instagram.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-elephan-instagram
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install fonts and renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Render and verify 5 JPEGs per day
        run: |
          python scripts/render_posts.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          p=json.loads(Path('posts.json').read_text(encoding='utf-8'))
          for post in p:
            if post['date']<'2026-10-18':continue
            root=Path('generated/glam-v1')/post['date']
            for n in range(1,6):
              f=root/f'{n:02d}.jpg'
              with Image.open(f) as im:
                if im.size!=(1080,1350) or im.format!='JPEG':
                  raise ValueError(f'Invalid carousel slide: {f}')
              if f.stat().st_size<30000:raise ValueError(f'Empty slide: {f}')
            print('VERIFIED',post['date'],'5 JPEG images')
          PY
      - name: Commit only new glamorous assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/glam-v1/
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Render ELEPHAN glamorous 5-slide carousels"
          git push
