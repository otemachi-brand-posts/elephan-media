name: Render ELEPHAN neon Instagram carousels

on:
  push:
    branches: [main]
    paths:
      - 'posts.json'
      - 'scripts/render_posts.py'
      - 'scripts/render_neon_v3.py'
      - '.github/workflows/render-instagram.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-elephan-instagram
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Render neon-v3, 5 JPEGs per date
        run: |
          python scripts/render_posts.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          for p in json.loads(Path("posts.json").read_text()):
            if p["date"]<"2026-10-25":continue
            folder=Path("generated/neon-v3")/p["date"]
            for n in range(1,6):
              path=folder/f"{n:02d}.jpg"
              if not path.is_file():raise RuntimeError(str(path)+" missing")
              with Image.open(path) as im:
                assert im.format=="JPEG" and im.size==(1080,1350)
            print("VERIFIED 5",p["date"],flush=True)
          PY
      - name: Save neon media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/neon-v3/
          if git diff --cached --quiet; then
            echo "No new images"
            exit 0
          fi
          git commit -m "Render ELEPHAN neon-v3 5-image daily carousels"
          git pull --rebase origin main
          git push
